<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevista AI - PFM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <a href="../index.html" class="home-btn">Voltar</a>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>Entrevista AI</h1>
            <p>Converse com nosso assistente de entrevista para praticar suas habilidades</p>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>
        
        <div class="chat-input">
            <textarea id="user-input" placeholder="Digite sua mensagem aqui..."></textarea>
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
